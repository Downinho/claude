<!doctype html><html><head><meta charset="utf-8"><title>Anúncios Downway</title>
<style>
@font-face{font-family:"Bebas Neue";src:url(fonts/bebas-neue-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:"Plex Mono";font-weight:400;src:url(fonts/ibm-plex-mono-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:"Plex Mono";font-weight:500;src:url(fonts/ibm-plex-mono-latin-500-normal.woff2) format("woff2")}
@font-face{font-family:"Inter";font-weight:100 900;src:url(fonts/inter-latin-wght-normal.woff2) format("woff2")}
html,body{margin:0;background:#000}canvas{display:block;width:100vw;height:auto}
</style></head><body><canvas id="c"></canvas>
<script src="engine.js"></script>
<script>
const ad = new URLSearchParams(location.search).get("ad") || "1";
window.ready = (async () => {
  await Promise.all(['120px "Bebas Neue"','400 20px "Plex Mono"','500 20px "Plex Mono"','500 20px "Inter"','700 20px "Inter"'].map(f=>document.fonts.load(f)));
  await new Promise((r)=>{const s=document.createElement("script");s.src=`ad${ad}.js`;s.onload=r;document.body.appendChild(s);});
  if (window.setup) await window.setup();
  return true;
})();
</script></body></html>
